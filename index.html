<!DOCTYPE html>
<html lang="en" oncontextmenu="return false">
	<head>
		<link
			href="data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw=="
			rel="icon"
		>
		<link
			href="manifest.json"
			rel="manifest"
		>
		<link
			href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,1,0&icon_names=attach_file,attach_file_off,send,settings,theater_comedy"
			rel="stylesheet"
		>
		<meta charset="UTF-8">
		<meta name="theme-color" content="Black">
		<meta
			content="initial-scale=1,maximum-scale=1,user-scalable=no,width=device-width"
			name="viewport"
		>
		<title>&zwj;</title>
		<style>
			@import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400&display=swap');

			::selection {
				background: var(--fg);
				color: var(--bg);
			}
			:focus {
				outline: none;
			}
			:root {
				--bg: Black;
				--bord: 2px solid currentColor;
				--fg: Whitesmoke;
				--font: monospace;
				--pad: 1rem;
				--pt: 14pt;
				-webkit-tap-highlight: transparent;
				background: var(--bg);
				color: var(--fg);
				font-family: 'Outfit', monospace;
				font-size: var(--pt);
				height: 100dvh;
				height: var(--visual-viewport-height);
				user-select: none;
			}
			article {
				overflow-y: auto;
				overscroll-behavior-y: none;
			}
			article, body, main {
				height: 100%;
			}
			body {
				box-sizing: border-box;
				margin: 0;
				overscroll-behavior-y: none;
				padding: var(--pad);
			}
			button, input {
				background: inherit;
				border: none;
				color: inherit;
				font-family: inherit;
				font-size: inherit;
			}
			button:not(:disabled) {
				cursor: pointer;
				transition: scale 0.3s;
			}
			button:not(:active) {
				transform: translateY(2px);
			}
			button:disabled {
				opacity: 0.5;
			}
			form {
				box-sizing: border-box;
			}
			input {
				min-width: 0;
				padding: 0.5rem;
			}
			main {
				box-sizing: border-box;
				margin: auto;
				max-width: 80ch;
			}
			section {
				padding-bottom: 0.5rem;
			}
			section::before {
				content: 'Me: ';
				opacity: 0.5;
			}
			section.is_agent::before {
				content: 'Gaia: ';
			}
			.flex {
				display: flex;
				flex-direction: column;
			}
			.flex-center {
				align-items: center;
				justify-content: center;
			}
			.flex-end {
				justify-content: flex-end;
			}
			.flex-fill {
				flex: 1;
			}
			.flex-gap {
				gap: var(--pad);
			}
			.flex-reverse {
				flex-direction: column-reverse;
			}
			.flex-row {
				flex-direction: row;
			}
			.material-symbols-rounded {
				display: flex;
			}
			#hiddenElements {
				display: none;
			}
			#uiTogglePrivate {
				display: none;
			}
		</style>
	</head>
	<body>
		<main class="flex flex-gap">
			<header class="flex"></header>
			<article class="flex flex-fill">
				<div
					class="flex flex-fill flex-gap flex-end"
					id="transcript"
				>
				</div>
			</article>
			<footer>
				<form class="flex flex-row flex-gap">
					<button id="uiPersona" type="button">
						<span class="material-symbols-rounded">settings</span>
					</button>
					<input
						autofocus
						class="flex-fill"
						placeholder="Prompt…"
					>
					<button id="uiAttach" type="button">
						<span class="material-symbols-rounded">attach_file</span>
					</button>
					<button id="uiTogglePrivate" type="button">
						<span class="material-symbols-rounded">backspace</span>
					</button>
					<button id="uiSay" type="submit">
						<span class="material-symbols-rounded">send</span>
					</button>
				</form>
			</footer>
		</main>
		<div id="hiddenElements">
			<input id="fileInput" type="file">
		</div>
		<script type="module">
			import Gaia from './gaia.js'

			const query_params = new URLSearchParams(window.location.search)

			const input = document.getElementById('fileInput')
			const transcript = document.getElementById('transcript')
			const chat_form = document.getElementsByTagName('form')[0]
			const chat_input = document.getElementsByTagName('input')[0]
			const okgo = document.getElementById('uiSay')
			const ui_attach = document.getElementById('uiAttach')
			const ui_goldfish = document.getElementById('uiTogglePrivate')
			const ui_persona = document.getElementById('uiPersona')

			if (!localStorage.getItem('GAIA_PERSONA')) {
				localStorage.setItem(
					'GAIA_PERSONA',
					'Your name is Gaia.',
				)
			}

			const ai = new Gaia({
				api_key: getApikey(),
				persona: localStorage.getItem('GAIA_PERSONA') +
					' Respond exclusively in plaintext. No markdown. You may use the occasional emoji no more than two or three times per ten responses. Always keep your responses brief enough to fit in a standard SMS.',
				print_function: (text) => {
					const last_bubble = transcript.lastElementChild
					if (last_bubble.classList.contains('is_agent')) {
						last_bubble.textContent += text
					} else {
						addBubble(text, true)
					}
					transcript.parentElement.scrollBy(0, 1000)
				},
			})

			document.body.addEventListener('click', () => {
				chat_input.focus()
			})

			chat_form.addEventListener('submit', async (e) => {
				e.preventDefault()
				if (e.submitter.id === 'uiSay') {
					const _prompt = chat_input.value.trim()
					chat_input.value = ''
					if (!_prompt) return
					chat_input.value = ''
					addBubble(_prompt)

					const ask_obj = {
						preserve_context: true,
						user_prompt: _prompt,
					}

					const f = await getAttachment()
					if (f) ask_obj.attachments = [f]

					console.log(ask_obj)

					const result = await ai.ask(ask_obj)
					if (result.err) {
						console.error(result.err)
					}
				}
			})

			okgo.oncontextmenu = () => {
				const ok = confirm('Discard chat?')
				if (ok) {
					localStorage.setItem('GAIA_PERSONA', '')
					localStorage.setItem('GAIA_TRANSCRIPT', '')
					location.reload()
				}
			}

			ui_attach.onclick = () => {
				input.click()
			}

			ui_persona.onclick = () => {
				const ok = prompt(
					"Describe Gaia's persona...",
					localStorage.getItem('GAIA_PERSONA'),
				)
				if (ok) {
					localStorage.setItem('GAIA_PERSONA', ok)
					ai.PERSONA = localStorage.getItem('GAIA_PERSONA')
				}
			}

			function addBubble(text_content, is_agent = false) {
				const new_bubble = document.createElement('section')
				new_bubble.textContent = text_content
				if (is_agent) {
					new_bubble.classList.add('is_agent')
				}
				transcript.appendChild(new_bubble)
			}

			function getApikey() {
				const api_key = query_params.get('api_key')
				if (api_key) {
					localStorage.setItem('GAIA_API_KEY', api_key)
				}
				let gaia_api_key = localStorage.getItem('GAIA_API_KEY')
				if (!gaia_api_key) {
					const ok = prompt('Gaia API Key')
					if (!ok) this.getApikey()
					localStorage.setItem('GAIA_API_KEY', ok)
					gaia_api_key = ok
				}
				return gaia_api_key
			}

			async function getAttachment() {
				const file = input.files[0]
				console.log(file)
				if (!file) return null
				return new Promise((resolve) => {
					const reader = new FileReader()
					reader.onload = (event) => {
						const base64Data = event.target.result.split(',')[1]
						const return_obj = {
							data: base64Data,
							mime_type: file.type,
						}
						console.log(return_obj)
						resolve(return_obj)
					}
					reader.readAsDataURL(file)
				})
			}

			function setViewportHeight() {
				const height = window.visualViewport.height
				document.documentElement.style.setProperty(
					'--visual-viewport-height',
					`${height}px`,
				)
			}

			window.visualViewport.addEventListener('resize', () => {
				setViewportHeight()
			})

			setViewportHeight()

			navigator.serviceWorker.register('nil.js')
		</script>
	</body>
</html>
