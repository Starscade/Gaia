<!DOCTYPE html>
<html lang="en" oncontextmenu="return false">
	<head>
		<link
			href="data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw=="
			rel="icon"
		>
		<link
			href="manifest.json"
			rel="manifest"
		>
		<link
			href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,1,0&icon_names=attachment,backspace,send,theater_comedy"
			rel="stylesheet"
		>
		<meta charset="UTF-8">
		<meta name="theme-color" content="Black">
		<meta
			name="viewport"
			content="initial-scale=1,maximum-scale=1,user-scalable=no,width=device-width"
		>
		<title>&zwj;</title>
		<style>
			@import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400&display=swap');

			::selection {
				background: var(--fg);
				color: var(--bg);
			}
			:focus {
				outline: none;
			}
			:root {
				--bg: Black;
				--bord: 2px solid currentColor;
				--fg: Whitesmoke;
				--font: monospace;
				--pad: 1rem;
				--pt: 14pt;
				-webkit-tap-highlight: transparent;
				background: var(--bg);
				color: var(--fg);
				font-family: 'Outfit', monospace;
				font-size: var(--pt);
				user-select: none;
			}
			:root, article, body, main {
				height: 100%;
			}
			article {
				overflow-y: auto;
				overscroll-behavior-y: none;
			}
			body {
				box-sizing: border-box;
				margin: 0;
				overscroll-behavior-y: none;
				padding: var(--pad);
			}
			button, input {
				background: inherit;
				border: none;
				color: inherit;
				font-family: inherit;
				font-size: inherit;
			}
			button {
				cursor: pointer;
				transition: scale .3s;
			}
			button:active {
				transform: translateY(2px);
			}
			button:focus, button:hover {
				transform: scale(1.2, 1.2);
			}
			form {
				box-sizing: border-box;
			}
			input {
				min-width: 0;
				padding: 0.5rem;
			}
			main {
				box-sizing: border-box;
				margin: auto;
				max-width: 80ch;
			}
			section {
				padding-bottom: .5rem;
			}
			section::before {
				content: 'Gaia: ';
				opacity: .5;
			}
			section.dark::before {
				content: 'Me: ';
			}
			.flex {
				display: flex;
				flex-direction: column;
			}
			.flex-center {
				align-items: center;
				justify-content: center;
			}
			.flex-end {
				justify-content: flex-end;
			}
			.flex-fill {
				flex: 1;
			}
			.flex-gap {
				gap: var(--pad);
			}
			.flex-reverse {
				flex-direction: column-reverse;
			}
			.flex-row {
				flex-direction: row;
			}
			.material-symbols-rounded {
				display: flex;
			}
		</style>
	</head>
	<body>
		<main class="flex flex-gap">
			<header class="flex"></header>
			<article class="flex flex-fill">
				<div
					class="flex flex-fill flex-gap flex-end"
					id="transcript"
				>
				</div>
			</article>
			<footer>
				<form class="flex flex-row flex-gap">
					<input
						autofocus
						class="flex-fill"
						placeholder="Say..."
					>
					<button id="uiAttach" type="button">
						<span class="material-symbols-rounded">attach_file</span>
					</button>
					<button id="uiTogglePrivate" type="button">
						<span class="material-symbols-rounded">visibility</span>
					</button>
					<button id="uiSay" type="submit">
						<span class="material-symbols-rounded">send</span>
					</button>
				</form>
			</footer>
		</main>
		<script type="module">
			import Gaia from './gaia.js'

			const query_params = new URLSearchParams(window.location.search)

			const transcript = document.getElementById('transcript')
			const chat_form = document.getElementsByTagName('form')[0]
			const chat_input = document.getElementsByTagName('input')[0]
			const okgo = document.getElementById('uiSay')
			const ui_goldfish = document.getElementById('uiTogglePrivate')

			const ai = new Gaia({
				api_key: getApikey(),
				persona:
					'You are a chat agent named Gaia. Respond exclusively in plaintext and emoji. Keep responses short enough to fit in a typical SMS.',
				print_function: (text) => {
					const last_bubble = transcript.lastElementChild
					last_bubble.textContent += text
					transcript.parentElement.scrollBy(0, 1000)
				},
			})

			document.body.addEventListener('click', () => {
				chat_input.focus()
			})

			chat_form.addEventListener('submit', async (e) => {
				e.preventDefault()
				if (e.submitter.id === 'uiSay') {
					const _prompt = chat_input.value.trim()
					chat_input.value = ''
					addBubble(_prompt, true)
					addBubble()
					const result = await ai.ask({
						preserve_context: true,
						user_prompt: _prompt,
					})
					if (result.err) {
						console.error(result.err)
					}
				}
			})

			ui_goldfish.onclick = () => {
				if (query_params.has('goldfish')) {
					location.href = './'
				} else {
					location.href = './?goldfish'
				}
			}

			if (query_params.has('goldfish')) {
				const icon = ui_goldfish.getElementsByTagName('span')[0]
				icon.textContent = 'visibility_off'
			}

			function addBubble(text_content, dark = false) {
				const new_bubble = document.createElement('section')
				new_bubble.textContent = text_content
				if (dark) {
					new_bubble.classList.add('dark')
				}
				transcript.appendChild(new_bubble)
			}

			function getApikey() {
				const api_key = query_params.get('api_key')
				if (api_key) {
					localStorage.setItem('GAIA_API_KEY', api_key)
				}
				let gaia_api_key = localStorage.getItem('GAIA_API_KEY')
				if (!gaia_api_key) {
					const ok = prompt('Gaia API Key')
					if (!ok) this.getApikey()
					localStorage.setItem('GAIA_API_KEY', ok)
					gaia_api_key = ok
				}
				return gaia_api_key
			}

			navigator.serviceWorker.register('nil.js')

		</script>
	</body>
</html>
