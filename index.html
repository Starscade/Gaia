<!DOCTYPE html>
<html lang="en" oncontextmenu="return false">
	<head>
		<meta charset="UTF-8">
		<meta name="theme-color" content="Black">
		<meta
			name="viewport"
			content="initial-scale=1,maximum-scale=1,user-scalable=no,width=device-width"
		>
		<link
			rel="icon"
			href="data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw=="
		>
		<title>&zwj;</title>
		<style>
			::selection {
				background: var(--fg);
				color: var(--bg);
			}
			:focus {
				outline: none;
			}
			:root {
				--bg: Black;
				--bord: 2px solid currentColor;
				--fg: Whitesmoke;
				--font: monospace;
				--pad: 1rem;
				--pt: 14pt;
				-webkit-tap-highlight: transparent;
				background: var(--bg);
				color: var(--fg);
				font-family: monospace;
				font-size: var(--pt);
				user-select: none;
			}
			:root, article, body, main {
				height: 100%;
			}
			article {
				overflow-y: auto;
			}
			article, footer {
				padding: var(--pad);
			}
			body {
				margin: 0;
			}
			button, input {
				background: inherit;
				border: none;
				color: inherit;
				font-family: inherit;
				font-size: inherit;
			}
			button {
				border: var(--bord);
				cursor: pointer;
				padding: 0 1rem;
			}
			button:focus, button:hover {
				background: var(--fg);
				border-color: var(--fg);
				color: var(--bg);
			}
			form {
				box-sizing: border-box;
			}
			input {
				border-bottom: var(--bord);
				min-width: 0;
				padding: 0.5rem;
			}
			main {
				box-sizing: border-box;
				margin: auto;
				max-width: 80ch;
			}
			section {
				background: var(--fg);
				color: var(--bg);
				padding: var(--pad);
			}
			.dark {
				background: var(--bg);
				border: var(--bord);
				color: var(--fg);
			}
			.flex {
				display: flex;
				flex-direction: column;
			}
			.flex-center {
				align-items: center;
				justify-content: center;
			}
			.flex-end {
				justify-content: flex-end;
			}
			.flex-fill {
				flex: 1;
			}
			.flex-gap {
				gap: var(--pad);
			}
			.flex-reverse {
				flex-direction: column-reverse;
			}
			.flex-row {
				flex-direction: row;
			}
		</style>
	</head>
	<body>
		<main class="flex flex-gap">
			<header class="flex"></header>
			<article class="flex flex-fill">
				<div
					class="flex flex-fill flex-gap flex-end"
					id="transcript"
				>
				</div>
			</article>
			<footer>
				<form class="flex flex-row flex-gap">
					<input
						autofocus
						class="flex-fill"
						placeholder="Chat..."
					>
					<button>OK</button>
				</form>
			</footer>
		</main>
		<script type="module">
			import Gaia from './src/gaia.js'

			const current_url = new URL(location.href)
			const url_params = new URLSearchParams(current_url.search)

			const transcript = document.getElementById('transcript')
			const chat_form = document.getElementsByTagName('form')[0]
			const chat_input = document.getElementsByTagName('input')[0]
			const okgo = document.getElementsByTagName('button')[0]

			const ai = new Gaia({
				api_key: url_params.get('api_key'),
				persona:
					'You are a chat agent named Gaia. Respond exclusively in plaintext.',
				print_function: (text) => {
					const last_bubble = transcript.lastElementChild
					last_bubble.textContent += text
					transcript.parentElement.scrollBy(0, 1000)
				},
			})

			document.body.addEventListener('click', () => {
				chat_input.focus()
			})

			chat_form.addEventListener('submit', async (e) => {
				e.preventDefault()
				const _prompt = chat_input.value.trim()
				chat_input.value = ''
				addBubble(_prompt, true)
				addBubble()
				const result = await ai.ask({
					preserve_context: !url_params.has('goldfish'),
					user_prompt: _prompt,
				})
				if (result.err) {
					console.error(result.err)
				}
			})

			function addBubble(text_content, dark = false) {
				const new_bubble = document.createElement('section')
				new_bubble.textContent = text_content
				if (dark) {
					new_bubble.classList.add('dark')
				}
				transcript.appendChild(new_bubble)
			}
		</script>
	</body>
</html>
